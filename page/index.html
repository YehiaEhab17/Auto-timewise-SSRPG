<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" type="text/css" href="style.css" />

    <title>Timesage</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>Timesage</h1>
      <p>Enter your save to begin</p>

      <div id="options">
        <h3>Options</h3>
        <fieldset>
          <legend>AFK Time</legend>
          <p>
            Filters results to fit within your AFK time range. Leave empty to show all
            results
          </p>
          <label for="afk-hours">Hours:</label>
          <input
            type="number"
            id="afk-hours"
            name="afk-hours"
            min="0"
            max="48"
            step="1"
            oninput="limitInput(this)"
            placeholder="00"
          />
          <label for="afk-minutes">Minutes:</label>

          <input
            type="number"
            id="afk-minutes"
            name="afk-minutes"
            min="0"
            max="59"
            step="1"
            oninput="limitInput(this)"
            placeholder="00"
          />
        </fieldset>

        <div id="events">
          <form id="events-form">
            <fieldset>
              <legend>Events</legend>
              <p>Choose an active event to gain bonus chest drops</p>

              <input type="radio" id="none" name="events" value="" checked />
              <label for="none">None</label>

              <input type="radio" id="plateau" name="events" value="rocky_plateau" />
              <label for="plateau">Rocky Plateau</label>

              <input type="radio" id="valley" name="events" value="deadwood_valley" />
              <label for="valley">Deadwood Valley</label>

              <input type="radio" id="caves" name="events" value="caustic_caves" />
              <label for="caves">Caves of Fear</label>

              <input type="radio" id="forest" name="events" value="fungus_forest" />
              <label for="forest">Mushroom Forest</label>

              <input type="radio" id="crypt" name="events" value="undead_crypt" />
              <label for="crypt">Haunted Halls</label>

              <input type="radio" id="mine" name="events" value="bronze_mine" />
              <label for="mine">Boiling Mine</label>

              <input type="radio" id="ridge" name="events" value="icy_ridge" />
              <label for="ridge">Icy Ridge</label>

              <input type="radio" id="temple" name="events" value="temple" />
              <label for="temple">Temple</label>
            </fieldset>
          </form>
        </div>
        <button type="button" id="update">Apply</button>
      </div>

      <div id="file">
        <h3>From file</h3>
        <input type="file" id="file-upload" name="userfile" accept=".txt" />
        <button disabled type="button" id="file-submit">Start</button>
      </div>

      <div id="text">
        <h3>From text</h3>
        <textarea
          id="text-upload"
          name="usertext"
          placeholder="Paste your save file here..."
        ></textarea>
        <button disabled type="button" id="text-submit">Start</button>
      </div>

      <p id="status" class="hidden"></p>

      <div id="results" class="hidden">
        <h2 id="table-header"></h2>
        <div id="controls">
          <button disabled type="button" id="toggle-deaths">Hide Deaths</button>
          <button disabled type="button" id="toggle-best">Use Best Times</button>
        </div>

        <div id="table-scroll">
          <table>
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      // ----------------------- VARIABLES ----------------------------
      let pyodide;
      let fileBtn = document.getElementById("file-submit");
      let textBtn = document.getElementById("text-submit");
      let fileInput = document.getElementById("file-upload");
      let textInput = document.getElementById("text-upload");
      let updateBtn = document.getElementById("update");

      let deathBtn = document.getElementById("toggle-deaths");
      let bestBtn = document.getElementById("toggle-best");
      let statusEl = document.getElementById("status");
      let resultsEl = document.getElementById("results");
      let tableBody = document.getElementById("table-body");
      let tableHead = document.getElementById("table-head");

      let afkHours = document.getElementById("afk-hours");
      let afkMinutes = document.getElementById("afk-minutes");
      let eventsForm = document.getElementById("events-form");

      textInput.addEventListener("input", updateButtons);
      fileInput.addEventListener("change", updateButtons);

      fileBtn.addEventListener("click", handleFile);
      textBtn.addEventListener("click", handleText);
      deathBtn.addEventListener("click", toggleDeaths);
      bestBtn.addEventListener("click", toggleBest);
      updateBtn.addEventListener("click", updateFilter);

      tableHead.addEventListener("click", (e) => handleSort(e));

      let sortKey = "enchant_rate";
      let sortDir = -1; // 1 asc, -1 desc
      let hideDeaths = false;
      let useBest = false;
      let currentLocations = [];
      let processing = false;
      let saveText = "";
      let eventLoc = "";
      let afkSeconds = 0;

      //prettier-ignore
      const columns = [
                      { key: "name",               label: "Location",       fmt: v => v,            group:"both", sort: (a,b)=>a.localeCompare(b) },
                      { key: "stars",              label: "Stars",          fmt: v => v + "*",      group:"both", sort: (a,b)=>a-b },
                      { key: "completed_in",       label: "Completion Time",fmt: fmtTime,           group:"avg",  sort: (a,b)=>a-b },
                      { key: "completed_in_best",  label: "Completion Time",fmt: fmtTime,           group:"best", sort: (a,b)=>a-b },
                      { key: "enchant_rate",       label: "Seconds for 1EP",fmt: fmtEP,             group:"avg",  sort: (a,b)=>a-b },
                      { key: "enchant_rate_best",  label: "Seconds for 1EP",fmt: fmtEP,             group:"best", sort: (a,b)=>a-b },
                      { key: "ends_in_death",      label: "Death",          fmt: v => v ? "✗":"✓", group:"both", sort: (a,b)=>a-b },
                   ];

      // ----------------------- MAIN LOGIC ----------------------------

      async function init() {
        pyodide = await loadPyodide();
        const res = await fetch("timewise.zip");
        await pyodide.unpackArchive(await res.arrayBuffer(), "zip");
      }

      async function run(save) {
        saveText = save;
        if (processing) return;
        processing = true;
        currentLocations = [];
        updateButtons();

        resultsEl.classList.add("hidden");
        statusEl.innerText = "Loading...";
        statusEl.classList.remove("hidden");
        statusEl.classList.remove("error");
        try {
          if (!pyodide) await init();

          pyodide.globals.set("save_text", save);
          pyodide.globals.set("event_loc", eventLoc);

          const result = pyodide.runPython(`
                    import json
                    from web.app import analyse_save
                    from core.location_data import load_from_json
                    location_values = load_from_json("chest_rates.json")
                    json.dumps(analyse_save(save_text, location_values, 0, event_loc))
                    `);
          showResults(JSON.parse(result));
          statusEl.classList.add("hidden");
          resultsEl.classList.remove("hidden");
        } catch (e) {
          statusEl.innerText = "Error: " + e.message;
          statusEl.classList.add("error");
        } finally {
          processing = false;
          textInput.value = "";
          fileInput.value = "";
          updateButtons();
        }
      }

      function showResults(results) {
        currentLocations = results.locations;
        document.getElementById("table-header").innerText =
          `Results for ${results.player_name} (level ${results.player_level})`;
        render();
      }

      function render() {
        let rows = currentLocations.filter((loc) => !loc.ends_in_death || !hideDeaths);

        const col = columns.find((c) => c.key === sortKey);
        rows.sort((a, b) => col.sort(a[sortKey], b[sortKey]) * sortDir);

        let activeCols = columns.filter((c) => c.group != (useBest ? "avg" : "best"));

        const headers = activeCols
          .map((c) => {
            const arrow = c.key === sortKey ? (sortDir === 1 ? " ▲" : " ▼") : "";
            return `<th data-key='${c.key}'>` + c.label + arrow + "</th>";
          })
          .join("");

        let afkFrames = afkSeconds * 30 * 1.15; //adding a factor of 15% to show runs that might be slightly over the afk time
        if (afkFrames)
          rows = rows.filter(
            (r) => (useBest ? r.completed_in_best : r.completed_in) <= afkFrames,
          );

        const html = rows
          .map((row) => {
            const cells = activeCols
              .map((c) => "<td>" + c.fmt(row[c.key]) + "</td>")
              .join("");
            const ri = useBest ? "rank_best" : "rank_avg";
            return `<tr class='rank-${row[ri]}'>` + cells + "</tr>";
          })
          .join("");

        tableBody.innerHTML = html;
        tableHead.innerHTML = headers;
      }

      // ----------------------- HELPERS ----------------------------

      function fmtTime(frames) {
        let s = Math.floor(frames / 30),
          h = Math.floor(s / 3600),
          m = Math.floor((s % 3600) / 60);
        return h + "h " + m + "m";
      }

      function fmtEP(rate) {
        return rate ? (1 / rate).toFixed(2) + "s/EP" : "-";
      }

      function limitInput(el) {
        const max = parseInt(el.max, 10);
        const min = parseInt(el.min, 10);
        let value = parseInt(el.value, 10);

        if (isNaN(value)) {
          el.value = 0;
        } else if (value > max) {
          el.value = max;
        } else if (value < min) {
          el.value = min;
        }
      }

      function updateOptions() {
        const afkSecondsNew = afkHours.value * 3600 + afkMinutes.value * 60;
        const eventLocNew = eventsForm.events.value;
        let changed = [];
        if (eventLoc != eventLocNew) {
          eventLoc = eventLocNew;
          changed.push("eventLoc");
        }
        if (afkSeconds != afkSecondsNew) {
          afkSeconds = afkSecondsNew;
          changed.push("afkSeconds");
        }
        return changed;
      }
      // ----------------------- HANDLERS ----------------------------

      function updateButtons() {
        const ready = !processing;
        fileBtn.disabled = !(ready && fileInput.files.length);
        textBtn.disabled = !(ready && textInput.value.trim());

        updateBtn.disabled = !ready;
        deathBtn.disabled = !(ready && currentLocations.length);
        bestBtn.disabled = !(ready && currentLocations.length);
      }

      async function handleText() {
        updateOptions();

        await run(textInput.value);
      }

      async function handleFile() {
        updateOptions();

        const text = await fileInput.files[0].text();
        await run(text);
      }

      function handleSort(event) {
        const key = event.target.dataset.key;
        if (sortKey === key) sortDir *= -1;
        else {
          sortKey = key;
          sortDir = key.includes("enchant_rate") ? 1 : -1;
        }
        render();
      }

      function toggleDeaths() {
        if (!hideDeaths) {
          deathBtn.innerText = "Show Deaths";
        } else {
          deathBtn.innerText = "Hide Deaths";
        }
        hideDeaths = !hideDeaths;
        render();
      }

      function toggleBest() {
        if (useBest) {
          bestBtn.innerText = "Use Best Times";
          sortKey = "enchant_rate";
        } else {
          bestBtn.innerText = "Use Average Times";
          sortKey = "enchant_rate_best";
        }
        useBest = !useBest;
        sortDir = -1;
        render();
      }

      function updateFilter() {
        const changed = updateOptions();
        if (!saveText) return;

        if (changed.includes("eventLoc")) run(saveText);
        else if (changed.includes("afkSeconds")) render();
      }
    </script>
  </body>
</html>
